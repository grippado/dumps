name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: lint
        run: make lint
      - name: validate public style packs
        run: python3 tools/validate-style-pack.py agents/skills/dump-this/style-packs
      - name: test
        run: make test
      - name: cross-build
        run: |
          cd server
          for t in linux/arm64 linux/amd64 darwin/arm64 darwin/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null .
          done
