tion:row-reverse;justify-content:flex-start;gap:8px;margin:0;padding:0}dialog menu button{font:inherit;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}dialog menu button.ok{background:var(--acc);border-color:var(--acc);color:#fff}dialog menu button.ok.danger{background:#d1453b;border-color:#d1453b}@media (max-width:640px){th:nth-child(n+4):not(:last-child),td:nth-child(n+4):not(:last-child){display:none}td.act button{padding:3px 8px}}</style></head><body><main>
